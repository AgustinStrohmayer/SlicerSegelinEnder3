[project]
name = "slicer-segelin-ender3"
version = "2.0.0.dev0"
description = "Hot-wire CNC slicer for Ender-3 — DXF in, G-code out."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"appSlicerSegelin/app.py" = ["E", "F", "B", "UP", "RUF"]  # legacy, do not touch yet
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["appSlicerSegelin/app.py", "archive/"]
